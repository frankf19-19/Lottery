# 彩研所 TWLottery Lab — 自動更新開獎資料
# BUILD_VERSION: v4.1.1
name: 更新開獎資料

on:
  schedule:
    # 開獎密集時段:台灣 20:32 起每 10 分鐘至 23:00(UTC 12:32–15:00)
    - cron: "32,42,52 12 * * *"
    - cron: "2,12,22,32,42,52 13 * * *"
    - cron: "2,12,22,32,42,52 14 * * *"
    - cron: "0 15 * * *"
    # 白天每小時保底:台灣 08:05–19:05(補官方事後修正)
    - cron: "5 0-11 * * *"
  workflow_dispatch: {}   # 允許在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      - name: 抓取最新開獎資料
        run: python scripts/update_data.py

      - name: 提交資料變更
        run: |
          git config user.name "twlottery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "資料無變更,不需提交。"
          else
            git commit -m "自動更新開獎資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
